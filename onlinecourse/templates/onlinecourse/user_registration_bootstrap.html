<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <h1>Sign Up</h1>
    {% if message %}<div class="alert alert-warning">{{ message }}</div>{% endif %}
    <form action="{% url 'onlinecourse:registration' %}" method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="username"><b>User Name</b></label>
            <input id="username" class="form-control" type="text" placeholder="Enter User Name" name="username" required>
            <label for="firstname"><b>First Name</b></label>
            <input id="firstname" class="form-control" type="text" placeholder="Enter First Name" name="firstname" required>
            <label for="lastname"><b>Last Name</b></label>
            <input id="lastname" class="form-control" type="text" placeholder="Enter Last Name" name="lastname" required>
            <label for="psw"><b>Password</b></label>
            <input id="psw" class="form-control" type="password" placeholder="Enter Password" name="psw" required>
            <button class="btn btn-primary mt-2" type="submit">Sign up</button>
        </div>
    </form>
</div>
</body>
</html>
